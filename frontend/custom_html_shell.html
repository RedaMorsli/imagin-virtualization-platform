<!DOCTYPE html>
<html>
    <head>
        <title>My Template</title>
        <meta charset="UTF-8">
        <style>
            html,
            body,
            #canvas {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                border: 0;
            }

            body {
                overflow: hidden;
                background: #ffffff;
            }

            #canvas {
                display: block;
            }

            #loading-overlay {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #ffffff;
                z-index: 10;
            }

            #loading-spinner {
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                from {
                    transform: rotate(0deg);
                }
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div id="loading-overlay">
            <img id="loading-spinner" src="loading_circle_black.png" alt="Loading">
        </div>
        <script src="$GODOT_URL"></script>
        <script>
            var engine = new Engine($GODOT_CONFIG);
            var loadingOverlay = document.getElementById("loading-overlay");

            engine.startGame().then(function () {
                loadingOverlay.style.display = "none";
            }).catch(function (error) {
                console.error(error);
            });
        </script>
    </body>
</html>
