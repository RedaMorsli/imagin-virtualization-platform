<!DOCTYPE html>
<html>
    <head>
        <title>My Template</title>
        <meta charset="UTF-8">
        <style>
            html,
            body,
            #canvas {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                border: 0;
            }

            body {
                overflow: hidden;
                background: #ffffff;
            }

            #canvas {
                display: block;
            }

            #loading-overlay {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
                gap: 0.6rem;
                background: #ffffff;
                z-index: 10;
            }

            #loading-spinner {
                animation: spin 1s linear infinite;
            }

            #loading-percent {
                color: #000000;
                font-family: "Segoe UI", Arial, sans-serif;
                font-size: 1rem;
                font-weight: 600;
                letter-spacing: 0.04em;
            }

            @keyframes spin {
                from {
                    transform: rotate(0deg);
                }
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div id="loading-overlay">
            <img id="loading-spinner" src="loading_circle_black.png" alt="Loading">
            <div id="loading-percent">0%</div>
        </div>
        <script src="index.js"></script>
        <script>
            var engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":1531656,"index.wasm":37686550},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
            var loadingOverlay = document.getElementById("loading-overlay");
            var loadingPercent = document.getElementById("loading-percent");

            engine.startGame({
                onProgress: function (current, total) {
                    if (current > 0 && total > 0) {
                        var percent = Math.round((current / total) * 100);
                        loadingPercent.textContent = percent + "%";
                    }
                }
            }).then(function () {
                loadingOverlay.style.display = "none";
            }).catch(function (error) {
                console.error(error);
            });
        </script>
    </body>
</html>
