services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    environment:
      K8S_API_REWRITE_HOST: host.docker.internal
    expose:
      - "8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./front-web
      dockerfile: Dockerfile
    container_name: frontend
    environment:
      API_URL: https://${DOMAIN_NAME:?DOMAIN_NAME is required}/api/
    expose:
      - "80"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:?DOMAIN_NAME is required}
      NGINX_ENVSUBST_FILTER: DOMAIN_NAME
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
